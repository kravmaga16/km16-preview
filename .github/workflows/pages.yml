name: Publier KM16 Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: km16-preview-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier la maquette et extraire son JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.inscript=False; self.ids=set()
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if 'id' in attrs: self.ids.add(attrs['id'])
                  if tag=='script' and 'src' not in attrs: self.inscript=True
              def handle_endtag(self, tag):
                  if tag=='script': self.inscript=False
              def handle_data(self, data):
                  if self.inscript: self.scripts.append(data)
          page=Path('index.html').read_text(encoding='utf-8')
          parsed=Check(); parsed.feed(page)
          required={'search','status-filter','reset','cards','count','empty','km16-overview','km16-dossiers','profiles'}
          assert required <= parsed.ids, f'Missing UI elements: {required-parsed.ids}'
          assert not any('supabase' in script.lower() for script in parsed.scripts), 'Public preview script must not connect to Supabase'
          assert 'app.km16.fr' not in page, 'Public preview must not use production endpoints'
          assert parsed.scripts, 'Missing interactive script'
          Path('/tmp/km16-preview-check.js').write_text('\n'.join(parsed.scripts),encoding='utf-8')
          print('Structure and isolation verified')
          PY
          node --check /tmp/km16-preview-check.js
          node tests/preview-interactions.mjs
      - name: Installer les navigateurs de test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Tester l'interface dans Chromium et WebKit
        run: node tests/browser-smoke.mjs
      - name: Conserver les captures navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km16-browser-screenshots
          path: /tmp/km16-*.png
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer la maquette
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparer les fichiers publics
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Creer l'archive Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier la maquette
        id: deployment
        uses: actions/deploy-pages@v4
